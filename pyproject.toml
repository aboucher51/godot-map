[project]
name = "godot-map"
version = "0.2.0"
description = "Map a Godot 4 project's structure (scenes, scripts, autoloads, signals) into a Markdown summary and a JSON graph for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
keywords = ["godot", "gdscript", "code-map", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/aboucher51/godot-map"
Issues = "https://github.com/aboucher51/godot-map/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
