[project]
name = "godot-map"
version = "0.1.0"
description = "Map a Godot 4 project's structure (scenes, scripts, autoloads, signals) into a Markdown summary and a JSON graph for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
godot-map = "godot_map.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
